name: Resolve Expo SDK 58 dependencies
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Resolve Expo SDK 58 packages
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npx expo install expo-router expo-status-bar expo-audio expo-file-system @react-native-async-storage/async-storage react react-native react-native-safe-area-context react-native-screens react-dom react-native-web @expo/metro-runtime
          npx expo install --fix
          npm install --save-dev typescript @types/react --no-audit --no-fund
          npx expo install --fix
          npm ci --no-audit --no-fund
      - name: Commit resolved manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Resolve Expo SDK 58 packages and lockfile"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
